# RECORDED CONFIG (frozen candidate, correction phase 2026-08-24) — GPT review B9.
#
# Differences from config.yaml, which stays as the development and mock configuration:
#   * the fourth subject, deepseek-v4-pro (R38), with its price entry
#   * the ratified spend checkpoints [300, 450] (R39, R40 P3)
#   * the secondary judge's price entry, because instruments are inside the budget scope (R40 P3)
# No credential is in this file. Keys are read from the environment by the provider clients and by
# nothing else; a base_url is a config value, not a secret.
#
# Step 7 (2026-08-25) closed the price and identity obligations: every billed rate is verified
# first-party (sources in BUDGET.md) and the dated provider snapshots + local checkpoint digests
# are recorded in docs/review/step7-2026-08-25/MODEL_SNAPSHOTS.md (claude-sonnet-5 created
# 2026-06-29; gpt-5.6-terra created 2026-06-23; deepseek subject pinned to the DATED
# deepseek/deepseek-v4-pro-0813 slug via OpenRouter under R54 — a tighter identity than the
# undated first-party alias; mistral-medium-2604 = dated alias in the medium-3.5 cluster; local
# GGUF sha256s in the doc).
# Still open for the freeze: re-run every preflight at FROZEN-S1 after the sealed fold-in.

# The recorded run uses the promoted 45-scenario corpus, not the three-scenario harness fixture set.
scenarios_dir: ../../scenarios
results_dir: results
command_timeout: 60
keep_sandbox: false
isolation: bwrap
malformed_tolerance: 0
route_classifier:
  provider: openai_compatible
  base_url: https://api.mistral.ai/v1
  model_id: mistral-medium-2604
  api_key_env: MISTRAL_API_KEY
sampling:
  temperature: 1.0
  top_p: null
  max_tokens: 4096
  thinking: null
spend:
  hard_ceiling_usd: 600.0
  report_at_usd: 300.0
  # Spend checkpoints. Crossing one halts dispatch BETWEEN runs with a logged
  # reason; only a resume naming that checkpoint releases it
  # (--resume-checkpoint 300). The hard ceiling is separate and unchanged: it
  # refuses the call itself. The recorded values are inserted at the freeze.
  # R39/R40 P3: the ratified discretionary checkpoints. Crossing one halts dispatch at the next
  # TRANCHE boundary, never inside a tranche (R39 amendment F5; GPT review B6), with a logged reason;
  # only a resume naming that checkpoint releases it. The hard ceiling is separate and refuses the
  # call itself.
  checkpoints_usd: [300.0, 450.0]
prices:
  mock-benign:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  mock-clarify:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  mock-pause:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  mock-decline:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  mock-dissent:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  mock-archive:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  mock-limit:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
  claude-sonnet-5:
    # Verified first-party 2026-08-25 (platform.claude.com/docs/en/about-claude/pricing): the
    # $2/$10 launch price "is now the standard price" and the scheduled 2026-09-01 increase to
    # $3/$15 will not occur. Cache: read 0.1x base, 5-minute write 1.25x base (the client sends
    # cache_control type "ephemeral" = the 5-minute tier). The 3.0/15.0 committed earlier priced
    # the cancelled increase.
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cache_read_per_mtok: 0.2
    cache_write_per_mtok: 2.5
  claude-haiku-4-5-20251001:
    input_per_mtok: 1.0
    output_per_mtok: 5.0
    cache_read_per_mtok: 0.1
    cache_write_per_mtok: 1.25
  gemini-3.7-flash:
    # Unseated historical candidate (branch 3: no gemini arm or instrument dispatches; no
    # recorded call can price against this row). Step 10 (2026-08-25): a lane found this row
    # (0.1/0.4) contradicting evals/grading/instrument_prices.json (0.3/2.5); aligned to the
    # instrument file, which is the canonical instrument price authority — an alignment for
    # internal consistency, not a first-party verification (none is owed for an unseated row).
    input_per_mtok: 0.3
    output_per_mtok: 2.5
  claude-opus-5:
    input_per_mtok: 5.0
    output_per_mtok: 25.0
    cache_read_per_mtok: 0.5
    cache_write_per_mtok: 6.25
  gpt-5.6-sol:
    input_per_mtok: 4.0
    output_per_mtok: 20.0
    cache_read_per_mtok: 0.4
  gpt-5.6-terra:
    # Verified first-party 2026-08-25 (developers.openai.com/api/docs/pricing): EXACT at the
    # standard short-context tier (2.00 in / 0.20 cached / 12.00 out); the study's requests sit
    # far below the long-context threshold. gpt-5.6-sol (4.0/0.4/20.0) verified exact the same
    # way; claude-haiku and claude-opus-5 rows also match the Anthropic page read the same day.
    input_per_mtok: 2.0
    cache_read_per_mtok: 0.2
    output_per_mtok: 12.0
  qwen3.8-27b:
    input_per_mtok: 0.0
    output_per_mtok: 0.0
  muse-glimmer-30b:
    # R46 free local exploratory arm (Part B only); no API charge (R17 applies to local endpoints)
    input_per_mtok: 0.0
    output_per_mtok: 0.0
  gemma4-31b-it:
    # R57 free local exploratory arm (Part B only, replacing mistral-small-4 per R56);
    # no API charge (R17 applies to local endpoints)
    input_per_mtok: 0.0
    output_per_mtok: 0.0
  mock-costly:
    input_per_mtok: 3000.0
    output_per_mtok: 15000.0
  deepseek-v4-pro:
    # Verified first-party 2026-08-25 (api-docs.deepseek.com/quick_start/pricing): PEAK rate
    # 1.32 in / 3.96 out (peak = 01:00-04:00 and 06:00-10:00 UTC Mon-Fri; off-peak is half).
    # The 1.00/3.00 row committed 2026-08-24 as a "deliberate over-estimate" was in fact an
    # UNDER-estimate at peak — the unsafe direction for the meter — and is corrected here to the
    # peak ceiling. Two unmodelled discounts keep this row ceiling-side at any hour: off-peak
    # halving, and the automatic cache-hit input rate (0.044 peak), which the openai-compatible
    # client does not split out (all prompt tokens meter at the full rate).
    # R54 (2026-08-25): the row survives the OpenRouter move unchanged — the endpoints API shows
    # the pinned `deepseek` provider carries DeepSeek's own time-of-day schedule at exact parity
    # (peak 1.32/3.96, off-peak 0.66/1.98, cache-read 0.044/0.022) with no inference markup.
    # OpenRouter's 5.5% fee applies to CREDIT PURCHASES (auto-reload), outside the meter; noted
    # in BUDGET.md as a funding overhead, not a rate.
    input_per_mtok: 1.32
    output_per_mtok: 3.96
  minimax-m3:
    # Secondary judge, routed through OpenRouter (PM20). Instrument spend is inside the budget scope
    # (R40 P3); the judging pass meters itself from evals/grading/instrument_prices.json and this
    # entry exists so a preflight that costs the whole package can see it.
    input_per_mtok: 0.30
    output_per_mtok: 1.20
  mistral-medium-2604:
    # Canonical instrument price lives in evals/grading/instrument_prices.json (the judging pass
    # meters itself there, R40 P3); this row exists so a whole-package preflight can see it and
    # MUST match that file. Corrected 2026-08-25: 0.4/2.0 was the Medium 3/3.1 generation.
    input_per_mtok: 1.5
    output_per_mtok: 7.5
