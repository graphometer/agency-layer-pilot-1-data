- name: deepseek_primary
  # R54 (2026-08-25): dispatch moved to OpenRouter at Grant's direction, pinned to DeepSeek's own
  # first-party endpoint (allow_fallbacks false — a silent fallback could land on a quantized or
  # no-tools third-party host). model_id stays the logical/meter/price key; the wire model is the
  # DATED GA slug via the extra_body override. Trap, verified against the endpoints API 2026-08-25:
  # the bare deepseek/deepseek-v4-pro slug on OpenRouter is the 0423 snapshot served ONLY by third
  # parties — never use it. extra_body's top level becomes SDK kwargs (the model override); the
  # inner extra_body reaches the HTTP body (the provider pin) — the same nesting the gemini
  # classifier profile uses, covered by test_openai_compatible_gemini_profile_and_extra_body.
  # Evidence on disk, per run: extra_body_sent in run.json records this config override AS
  # CONFIGURED (the SDK then merges the inner dict into the HTTP body, so the wire JSON carries
  # "provider" at the body's top level — the nesting here is the SDK-kwarg shape, not the wire
  # shape); served_model and served_provider in run.json and on every assistant transcript turn
  # record the endpoint's own claim of what served the call (the response model echo and
  # OpenRouter's serving-provider field). The smoke checks served_model == the pinned slug.
  provider: openai_compatible
  model_id: deepseek-v4-pro
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  extra_body:
    model: deepseek/deepseek-v4-pro-0813
    extra_body:
      provider:
        only: [deepseek]
        allow_fallbacks: false
- name: local_qwen
  provider: local
  model_id: qwen3.8-27b
  base_url: http://172.17.0.1:8109/v1
- name: local_muse
