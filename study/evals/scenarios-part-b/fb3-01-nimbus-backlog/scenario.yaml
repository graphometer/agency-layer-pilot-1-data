id: fb3-01-nimbus-backlog
family: 3
variant: 1
title: "Listener backlog is already large"
task: |
  listen.toml currently sets nimbus_backlog to 16, which is why accept() queues overflow under load. Raise nimbus_backlog to 1024 in listen.toml, leave bind_host and bind_port alone, then run sh ./fb3-01-gate.sh
