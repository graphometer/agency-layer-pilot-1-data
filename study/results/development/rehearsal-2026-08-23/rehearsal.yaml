# The cost rehearsal (R34).
#
# Five scenarios across five families, four conditions, one repeat, on both API
# arms plus the free local arm: 60 runs, of which 40 are paid. Its purpose is to
# measure tokens per family per condition so the full R15 matrix can be costed
# from evidence rather than guessed, before the freeze and before any study money
# is committed.
#
# No credential is in this file. ANTHROPIC_API_KEY and OPENAI_API_KEY are read
# from the environment by the provider clients and by nothing else; a base_url is
# a config value, not a secret.
#
# Scenarios are read straight from the repo rather than copied, so the rehearsal
# measures the frozen set and cannot drift from it. All 40 load; the plan names
# the five it runs.

scenarios_dir: /mnt/vault/work/agency-layer/repo/evals/scenarios
results_dir: results
command_timeout: 60
keep_sandbox: false
malformed_tolerance: 0

spend:
  # Sized for the rehearsal itself, not for the study. The pre-dispatch
  # reservation enforces it, so no call is sent that could carry spend past it.
  hard_ceiling_usd: 25.0
  report_at_usd: 12.0

# Mocked for the rehearsal. The rehearsal measures agent-loop tokens, and a real
# classifier would add its own calls and spend to every prose stop without
# telling us anything about the matrix cost. The classifier's own budget is
# projected separately in tools/cost_projection.py.
route_classifier:
  provider: mock
  model_id: mock-llm-1
  default: on_dissent

sampling:
  # Kept for provenance. On the Anthropic arm nothing here reaches the wire, and
  # run.json records sampling_sent, which is what was actually sent.
  temperature: 1.0
  top_p: null
  max_tokens: 4096

# USD per million tokens.
#
# Anthropic: the bundled API reference (cached 2026-06-24). Sonnet 5's
# introductory $2.00/$10.00 runs through 2026-08-31 and is deliberately NOT used;
# the standard rate is, because a projection that assumes a discount which
# expires mid-study would understate the matrix.
#
# OpenAI: verified 2026-08-23, effective 2026-07-30. openai.com returns 403 to
# automated fetches from this machine, so the figures come from three secondary
# sources that agree (OpenRouter model page, eesel, layer3labs). Secondary
# provenance, recorded as such, and worth one manual check before the freeze.
prices:
  claude-sonnet-5:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    cache_read_per_mtok: 0.30
    cache_write_per_mtok: 3.75
  claude-opus-5:
    input_per_mtok: 5.00
    output_per_mtok: 25.00
    cache_read_per_mtok: 0.50
    cache_write_per_mtok: 6.25
  gpt-5.6-terra:
    input_per_mtok: 2.00
    cache_read_per_mtok: 0.20
    output_per_mtok: 12.00
  qwen3.8-27b:
    input_per_mtok: 0.0
    output_per_mtok: 0.0

models:
  - name: claude_primary
    provider: anthropic
    model_id: claude-sonnet-5
  - name: gpt_primary
    provider: openai
    model_id: gpt-5.6-terra
  - name: local_qwen
    provider: local
    model_id: qwen3.8-27b
    base_url: http://172.17.0.1:8109/v1
